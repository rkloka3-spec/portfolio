<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <filter id="laptopDarkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Laptop Lid & Screen (Dark sleek editorial) -->
  <rect x="70" y="40" width="560" height="350" rx="18" fill="#090d16" stroke="#1e293b" stroke-width="3" filter="url(#laptopDarkShadow)" />
  <!-- Screen Bezel -->
  <rect x="85" y="55" width="530" height="320" rx="10" fill="#0f172a" />
  
  <!-- Browser top nav -->
  <rect x="85" y="55" width="530" height="36" fill="#1e293b" />
  <circle cx="105" cy="73" r="5" fill="#ef4444" />
  <circle cx="120" cy="73" r="5" fill="#f59e0b" />
  <circle cx="135" cy="73" r="5" fill="#10b981" />
  <rect x="180" y="63" width="260" height="20" rx="6" fill="#0f172a" />
  <text x="310" y="77" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">mediant-pro.io/analytics</text>

  <!-- Dark Dashboard Content -->
  <!-- Line chart simulation -->
  <path d="M 120 250 Q 180 180, 240 220 T 360 160 T 480 190 T 560 130" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 120 250 Q 180 180, 240 220 T 360 160 T 480 190 T 560 130 L 560 280 L 120 280 Z" fill="#38bdf8" fill-opacity="0.1" />

  <!-- Metric Badges -->
  <rect x="120" y="110" width="130" height="60" rx="8" fill="#1e293b" />
  <text x="135" y="132" fill="#94a3b8" font-size="10">Active Reach</text>
  <text x="135" y="158" fill="#f8fafc" font-size="16" font-weight="700">1.84M +</text>

  <rect x="270" y="110" width="130" height="60" rx="8" fill="#1e293b" />
  <text x="285" y="132" fill="#94a3b8" font-size="10">Auto Engagement</text>
  <text x="285" y="158" fill="#4ade80" font-size="16" font-weight="700">+34.8%</text>

  <!-- Floating Overlay Card matching reference: Mediant Pro - Social Media Automation Dashboard -->
  <rect x="100" y="275" width="490" height="88" rx="14" fill="#000000" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
  <!-- Mini tags -->
  <rect x="120" y="290" width="68" height="20" rx="10" fill="#334155" />
  <text x="154" y="304" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">SaaS</text>
  <rect x="194" y="290" width="68" height="20" rx="10" fill="#334155" />
  <text x="228" y="304" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Product</text>
  
  <text x="120" y="336" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Mediant Pro — Social Media Automation Dashboard</text>
  
  <!-- Arrow circle -->
  <circle cx="550" cy="318" r="18" fill="#ffffff" fill-opacity="0.15" />
  <text x="550" y="324" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">↗</text>

  <!-- Laptop Base -->
  <path d="M 40 390 L 660 390 L 690 415 L 10 415 Z" fill="#334155" />
  <rect x="300" y="390" width="100" height="8" rx="4" fill="#1e293b" />
</svg>
