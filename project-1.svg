<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="gameSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Phone Mockup Frame -->
  <rect x="80" y="20" width="440" height="660" rx="44" fill="#030712" stroke="#1f2937" stroke-width="6" filter="url(#shadow)" />
  <rect x="96" y="36" width="408" height="628" rx="36" fill="url(#phoneBg)" />

  <!-- Phone Notch / Dynamic Island -->
  <rect x="230" y="48" width="140" height="24" rx="12" fill="#030712" />

  <!-- Game Header -->
  <rect x="110" y="90" width="380" height="56" rx="12" fill="#1f2937" stroke="#374151" />
  <text x="125" y="124" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Flexbox Quest</text>
  <text x="260" y="124" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Lives: 3  Coins: 120</text>
  <rect x="420" y="102" width="56" height="30" rx="8" fill="#3b82f6" />
  <text x="448" y="122" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Menu</text>

  <!-- Game Area -->
  <rect x="110" y="156" width="380" height="210" rx="14" fill="url(#gameSky)" />
  <!-- Star -->
  <circle cx="340" cy="200" r="14" fill="#facc15" />
  <text x="340" y="205" fill="#78350f" font-size="14" font-weight="bold" text-anchor="middle">★</text>
  <!-- Player -->
  <rect x="160" y="230" width="38" height="38" rx="8" fill="#ec4899" />
  <text x="179" y="254" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">YOU</text>
  <!-- Platforms -->
  <rect x="130" y="275" width="100" height="16" rx="6" fill="#10b981" />
  <rect x="270" y="235" width="90" height="16" rx="6" fill="#10b981" />
  <rect x="210" y="325" width="180" height="18" rx="6" fill="#059669" />

  <!-- Game Panels Grid: Controls, Inventory, Quest -->
  <!-- Panel 1: Controls -->
  <rect x="110" y="378" width="182" height="135" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="122" y="400" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Controls</text>
  <!-- Buttons -->
  <rect x="188" y="412" width="28" height="26" rx="6" fill="#3b82f6" />
  <text x="202" y="429" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">↑</text>
  <rect x="156" y="442" width="28" height="26" rx="6" fill="#3b82f6" />
  <text x="170" y="459" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">←</text>
  <rect x="188" y="442" width="28" height="26" rx="6" fill="#3b82f6" />
  <text x="202" y="459" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">↓</text>
  <rect x="220" y="442" width="28" height="26" rx="6" fill="#3b82f6" />
  <text x="234" y="459" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">→</text>
  <rect x="156" y="474" width="92" height="26" rx="6" fill="#10b981" />
  <text x="202" y="491" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">JUMP</text>

  <!-- Panel 2: Inventory -->
  <rect x="306" y="378" width="184" height="135" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="318" y="400" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Inventory</text>
  <rect x="318" y="414" width="76" height="34" rx="6" fill="#0f172a" stroke="#475569" />
  <text x="356" y="435" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">⚔️ Sword</text>
  <rect x="402" y="414" width="76" height="34" rx="6" fill="#0f172a" stroke="#475569" />
  <text x="440" y="435" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">🛡️ Shield</text>
  <rect x="318" y="456" width="76" height="34" rx="6" fill="#0f172a" stroke="#475569" />
  <text x="356" y="477" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">🧪 Potion</text>
  <rect x="402" y="456" width="76" height="34" rx="6" fill="#0f172a" stroke="#475569" />
  <text x="440" y="477" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">🔑 Key</text>

  <!-- Panel 3: Quest Panel -->
  <rect x="110" y="524" width="380" height="110" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="122" y="546" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Active Quests</text>
  <text x="124" y="570" fill="#f8fafc" font-size="12">Collect 3 Stars</text>
  <text x="440" y="570" fill="#38bdf8" font-size="12" font-weight="bold">1 / 3</text>
  <line x1="124" y1="582" x2="470" y2="582" stroke="#334155" />
  <text x="124" y="605" fill="#f8fafc" font-size="12">Find the Golden Key</text>
  <text x="440" y="605" fill="#94a3b8" font-size="12">0 / 1</text>
</svg>
