<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <filter id="tabletShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Laptop / Tablet Stand Frame -->
  <rect x="70" y="40" width="560" height="350" rx="18" fill="#1e293b" stroke="#475569" stroke-width="3" filter="url(#tabletShadow)" />
  <rect x="85" y="55" width="530" height="320" rx="10" fill="#f8fafc" />

  <!-- University Portal Grid UI -->
  <rect x="85" y="55" width="530" height="40" fill="#1e3a8a" />
  <text x="110" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Campus Connect • SST &amp; BITS Pilani</text>
  <rect x="490" y="65" width="100" height="22" rx="11" fill="#3b82f6" />
  <text x="540" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Student Hub</text>

  <!-- Content 3 cards grid -->
  <rect x="105" y="110" width="150" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="115" y="120" width="130" height="75" rx="6" fill="#bfdbfe" />
  <text x="120" y="215" fill="#0f172a" font-size="12" font-weight="700">Algorithms Lab</text>
  <text x="120" y="235" fill="#64748b" font-size="10">Collaborative notes, lecture slides, and practice sets.</text>
  <rect x="120" y="295" width="80" height="24" rx="4" fill="#2563eb" />
  <text x="160" y="311" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">View Notes</text>

  <rect x="275" y="110" width="150" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="285" y="120" width="130" height="75" rx="6" fill="#fbcfe8" />
  <text x="290" y="215" fill="#0f172a" font-size="12" font-weight="700">Web Dev Cohort</text>
  <text x="290" y="235" fill="#64748b" font-size="10">HTML5, CSS3, Flexbox &amp; Grid project repository.</text>
  <rect x="290" y="295" width="80" height="24" rx="4" fill="#db2777" />
  <text x="330" y="311" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Join Sprint</text>

  <rect x="445" y="110" width="150" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="455" y="120" width="130" height="75" rx="6" fill="#bbf7d0" />
  <text x="460" y="215" fill="#0f172a" font-size="12" font-weight="700">AI Innovation</text>
  <text x="460" y="235" fill="#64748b" font-size="10">Research projects, neural nets, and AI tools.</text>
  <rect x="460" y="295" width="80" height="24" rx="4" fill="#16a34a" />
  <text x="500" y="311" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Explore</text>

  <!-- Laptop Base -->
  <path d="M 40 390 L 660 390 L 690 415 L 10 415 Z" fill="#94a3b8" />
  <rect x="300" y="390" width="100" height="8" rx="4" fill="#64748b" />
</svg>
