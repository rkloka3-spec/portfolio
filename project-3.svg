<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="80" y="20" width="440" height="660" rx="44" fill="#090d16" stroke="#1e293b" stroke-width="6" filter="url(#shadow3)" />
  <rect x="96" y="36" width="408" height="628" rx="36" fill="url(#aiBg)" />

  <!-- Notch -->
  <rect x="230" y="48" width="140" height="24" rx="12" fill="#020617" />

  <!-- Header -->
  <text x="130" y="110" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">AI Algorithm Visualizer</text>
  <text x="130" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">BITS Pilani CS &amp; AI Research Hub</text>

  <!-- Neural Net / Graph Visualization Mockup -->
  <rect x="115" y="150" width="370" height="220" rx="16" fill="#0b1329" stroke="#1e293b" />
  
  <!-- Graph Nodes and Edges -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <line x1="160" y1="220" x2="250" y2="190" />
    <line x1="160" y1="220" x2="250" y2="260" />
    <line x1="160" y1="300" x2="250" y2="260" />
    <line x1="250" y1="190" x2="350" y2="210" />
    <line x1="250" y1="260" x2="350" y2="210" />
    <line x1="250" y1="260" x2="350" y2="300" />
    <line x1="350" y1="210" x2="430" y2="250" />
    <line x1="350" y1="300" x2="430" y2="250" />
  </g>

  <circle cx="160" cy="220" r="14" fill="#6366f1" />
  <circle cx="160" cy="300" r="14" fill="#6366f1" />
  <circle cx="250" cy="190" r="14" fill="#38bdf8" />
  <circle cx="250" cy="260" r="16" fill="#ec4899" />
  <circle cx="350" cy="210" r="14" fill="#a855f7" />
  <circle cx="350" cy="300" r="14" fill="#38bdf8" />
  <circle cx="430" cy="250" r="18" fill="#10b981" />

  <!-- Metrics Grid -->
  <rect x="115" y="388" width="175" height="110" rx="12" fill="#1e293b" />
  <text x="130" y="415" fill="#94a3b8" font-size="11">Time Complexity</text>
  <text x="130" y="445" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="700">O(V + E)</text>
  <text x="130" y="475" fill="#4ade80" font-size="11">✓ Optimized BFS/DFS</text>

  <rect x="310" y="388" width="175" height="110" rx="12" fill="#1e293b" />
  <text x="325" y="415" fill="#94a3b8" font-size="11">Model Accuracy</text>
  <text x="325" y="445" fill="#ec4899" font-family="monospace" font-size="20" font-weight="700">99.2%</text>
  <text x="325" y="475" fill="#4ade80" font-size="11">✓ Scaled AI Model</text>

  <!-- Interactive Control Bar -->
  <rect x="115" y="515" width="370" height="120" rx="14" fill="#111827" stroke="#1f2937" />
  <text x="130" y="545" fill="#f8fafc" font-size="12" font-weight="600">Active Exploration:</text>
  <text x="250" y="545" fill="#a855f7" font-size="12">Graph Traversal &amp; Neural Weights</text>
  <rect x="130" y="565" width="150" height="34" rx="8" fill="#6366f1" />
  <text x="205" y="587" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Run Simulation ▶</text>
</svg>
