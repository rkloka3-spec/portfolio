<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="btnGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="playGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" rx="28" fill="url(#cardBg)" />

  <!-- Code editor mock layout in background -->
  <g opacity="0.4">
    <!-- Window controls -->
    <circle cx="40" cy="36" r="7" fill="#ef4444" />
    <circle cx="64" cy="36" r="7" fill="#f59e0b" />
    <circle cx="88" cy="36" r="7" fill="#10b981" />
    <line x1="20" y1="65" x2="780" y2="65" stroke="#334155" stroke-width="1.5" />
    
    <!-- Code lines -->
    <text x="40" y="110" fill="#38bdf8" font-family="monospace" font-size="16">// Scaler School of Technology &amp; BITS Pilani CS &amp; AI</text>
    <text x="40" y="145" fill="#c084fc" font-family="monospace" font-size="16">const <tspan fill="#f8fafc">developer</tspan> = {</text>
    <text x="70" y="180" fill="#94a3b8" font-family="monospace" font-size="16">name: <tspan fill="#4ade80">'Rajkumar Lokadhyaksha'</tspan>,</text>
    <text x="70" y="215" fill="#94a3b8" font-family="monospace" font-size="16">passion: <tspan fill="#4ade80">'Building high-performance UI &amp; Intelligent AI'</tspan>,</text>
    <text x="70" y="250" fill="#94a3b8" font-family="monospace" font-size="16">coreTech: [<tspan fill="#38bdf8">'HTML5'</tspan>, <tspan fill="#38bdf8">'CSS3'</tspan>, <tspan fill="#38bdf8">'Flexbox'</tspan>, <tspan fill="#38bdf8">'Data Structures'</tspan>],</text>
    <text x="70" y="285" fill="#94a3b8" font-family="monospace" font-size="16">motto: <tspan fill="#fcd34d">'Clean Code • Intuitive Architecture • Boundless Curiosity'</tspan></text>
    <text x="40" y="320" fill="#c084fc" font-family="monospace" font-size="16">};</text>
    
    <text x="40" y="380" fill="#38bdf8" font-family="monospace" font-size="16">developer.<tspan fill="#fcd34d">shipProject</tspan>(); <tspan fill="#64748b">// 🚀 Live Demo Ready</tspan></text>
  </g>

  <!-- Large Center Play Button Overlay matching reference -->
  <circle cx="400" cy="240" r="48" fill="#ffffff" fill-opacity="0.9" filter="url(#playGlow)" />
  <circle cx="400" cy="240" r="42" fill="#0f172a" />
  <polygon points="392,222 418,240 392,258" fill="#ffffff" />

  <!-- Bottom tag overlay -->
  <rect x="250" y="410" width="300" height="42" rx="21" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" />
  <text x="400" y="436" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Interactive Showcase &amp; Lab Walkthrough</text>
</svg>
